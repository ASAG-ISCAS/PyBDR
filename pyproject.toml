[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pybdr"
dynamic = ["version"]
description = "Set-boundary based Reachability Analysis Toolbox in Python"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
license-files = ["LICENSE.md"]
authors = [
    {name = "ASAG-ISCAS"}
]
keywords = ["reachability analysis", "formal verification", "nonlinear systems", "boundary analysis", "set-based methods"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "sympy>=1.12",
    "cvxpy>=1.3",
    "matplotlib>=3.7",
    "codac>=2.1",
]

[project.optional-dependencies]
vis = [
    "plotly>=5",
]
test = [
    "pytest>=7",
]
dev = [
    "pybdr[vis,test]",
    "build",
    # execute the example notebooks (scripts/run_checks.py)
    "nbformat",
    "nbclient",
    "ipykernel",
]

[project.urls]
Homepage = "https://github.com/ASAG-ISCAS/PyBDR"
Documentation = "https://asag-iscas.github.io/docs.pybdr/"
Repository = "https://github.com/ASAG-ISCAS/PyBDR"
Issues = "https://github.com/ASAG-ISCAS/PyBDR/issues"

[tool.setuptools.dynamic]
version = {attr = "pybdr.__version__"}

[tool.setuptools.packages.find]
include = ["pybdr*"]

[tool.pytest.ini_options]
testpaths = ["test"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: executes the example notebooks, about 30 minutes (skip with -m \"not slow\")",
]

[tool.black]
line-length = 120
target-version = ["py311", "py312", "py313"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
