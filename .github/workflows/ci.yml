name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install ".[test]"
      # plain `pytest` (not `python -m pytest`) so that the installed package is tested
      - name: Test
        run: pytest -m "not slow"

  build:
    name: build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  colab:
    # same OS and Python as Google Colab, PyBDR installed with pip only
    name: colab demo notebook
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install the built wheel
        run: |
          python -m pip install build
          python -m build --wheel
          python -m pip install "$(ls dist/*.whl)[vis]" nbclient ipykernel
      # the install cell of the notebook is skipped because PyBDR is already installed
      - name: Run the notebook
        run: |
          python - <<'PY'
          import nbformat
          from nbclient import NotebookClient
          nb = nbformat.read("examples/colab_demo.ipynb", as_version=4)
          # run from examples/ so that the installed package is imported, not the source tree
          NotebookClient(nb, timeout=1200, kernel_name="python3",
                         resources={"metadata": {"path": "examples"}}).execute()
          PY
