# codac is not on conda-forge yet: repackage the official PyPI wheels (one package per Python version)
context:
  version: "2.1.1"

package:
  name: codac
  version: ${{ version }}

build:
  number: 0
  # the wheel already contains the compiled extension modules, pip is allowed to download it
  script:
    env:
      PIP_NO_INDEX: "false"
    content: "${{ PYTHON }} -m pip install codac==${{ version }} --no-deps --only-binary=:all: -vv"
  dynamic_linking:
    # the wheel is self-contained (libraries are found relative to the extension modules)
    binary_relocation: false

requirements:
  host:
    - python
    - pip
  run:
    - python
    - pip
    - vibes

tests:
  - python:
      imports:
        - codac

about:
  homepage: https://codac.io
  summary: Codac, a library for constraint programming over reals, trajectories and sets
  license: LGPL-3.0-or-later
