# vibes: client of the VIBes viewer, a dependency declared by codac (only on PyPI)
context:
  version: "0.2.2"
  python_min: "3.11"

package:
  name: vibes
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/v/vibes/vibes-${{ version }}.tar.gz
  sha256: 4fda81a1449bf518e1d23e5cf078d7b13e4a241a954bd03a6709543fcd58b51e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - vibes
      python_version: ${{ python_min }}.*

about:
  homepage: https://github.com/ENSTABretagneRobotics/VIBES
  summary: Python client of the VIBes visualization tool
  license: GPL-3.0-or-later
