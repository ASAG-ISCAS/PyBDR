context:
  # keep in sync with pybdr/__init__.py
  version: "1.1.0"
  python_min: "3.11"

package:
  name: pybdr
  version: ${{ version }}

source:
  path: ../..

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77
  run:
    - python >=${{ python_min }}
    - numpy >=1.24
    - scipy >=1.10
    - sympy >=1.12
    - cvxpy >=1.3
    - matplotlib-base >=3.7
    - codac >=2.1
  run_constraints:
    # optional, for the interactive 3D plots
    - plotly >=5

tests:
  - python:
      imports:
        - pybdr
        - pybdr.algorithm
        - pybdr.util.visualization
      python_version: ${{ python_min }}.*
  - files:
      source:
        - test/
    requirements:
      run:
        - python ${{ python_min }}.*
        - pytest
        - plotly
    script:
      - pytest test -m "not slow" -q -p no:cacheprovider

about:
  homepage: https://github.com/ASAG-ISCAS/PyBDR
  documentation: https://asag-iscas.github.io/docs.pybdr/
  summary: Set-boundary based Reachability Analysis Toolbox in Python
  license: GPL-3.0-only
  license_file: LICENSE.md
