# environment.yml plus the tools to test and package PyBDR:
#   conda env create -f environment-dev.yml
#   conda activate pybdr-dev
name: pybdr-dev
channels:
  - conda-forge
dependencies:
  - python>=3.11
  - numpy>=1.24
  - scipy>=1.10
  - sympy>=1.12
  - cvxpy>=1.3
  - matplotlib-base>=3.7
  - plotly>=5
  - pytest>=7
  - python-build
  - twine
  - rattler-build
  - pip
  - pip:
      - codac>=2.1
      - --editable .
